<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Construtora Pignus · Painel Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: sidebar fixa à esquerda + área principal em grade (coluna de indicadores 360px | gráficos). Dark-first, igual ao painel de referência. */
:root{
  --bg:#061316; --bg-2:#081a1e; --panel:#0b1e23; --panel-2:#0f272d;
  --line:rgba(140,205,212,.12); --line-2:rgba(140,205,212,.22);
  --fg:#e3eeef; --muted:#87a2a6; --faint:#58767a;
  --pos:#2ccb72; --neg:#ef4b4b; --warn:#f2b33d;
  --accent:#22d3ee; --accent-ink:var(--accent);
  --f-sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#edf3f3; --bg-2:#e3ecec; --panel:#ffffff; --panel-2:#f3f8f8;
  --line:rgba(14,58,64,.12); --line-2:rgba(14,58,64,.22);
  --fg:#0c2226; --muted:#4f6b6e; --faint:#8aa1a2;
  --pos:#119a52; --neg:#d23535; --warn:#b77905;
  --accent-ink:color-mix(in srgb,var(--accent) 62%,#000); color-scheme:light;}}
:root[data-theme="light"]{
  --bg:#edf3f3; --bg-2:#e3ecec; --panel:#ffffff; --panel-2:#f3f8f8;
  --line:rgba(14,58,64,.12); --line-2:rgba(14,58,64,.22);
  --fg:#0c2226; --muted:#4f6b6e; --faint:#8aa1a2;
  --pos:#119a52; --neg:#d23535; --warn:#b77905;
  --accent-ink:color-mix(in srgb,var(--accent) 62%,#000); color-scheme:light;}
:root[data-theme="dark"]{
  --bg:#061316; --bg-2:#081a1e; --panel:#0b1e23; --panel-2:#0f272d;
  --line:rgba(140,205,212,.12); --line-2:rgba(140,205,212,.22);
  --fg:#e3eeef; --muted:#87a2a6; --faint:#58767a;
  --pos:#2ccb72; --neg:#ef4b4b; --warn:#f2b33d;
  --accent-ink:var(--accent); color-scheme:dark;}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
/* Sidebar */
.side{background:var(--bg-2);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:12px;padding:22px 20px;border-bottom:1px solid var(--line);min-height:84px}
.brand img{max-height:40px;max-width:180px;object-fit:contain}
.brand svg{flex:none;color:var(--accent)}
.brand b{font-size:19px;font-weight:800;letter-spacing:.02em;line-height:1.05;display:block}
.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.navlabel{font-size:10.5px;letter-spacing:.2em;color:var(--faint);padding:22px 22px 8px;text-transform:uppercase;font-weight:700}
.nav{display:flex;flex-direction:column;gap:4px;padding:0 12px}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;border:1px solid transparent;background:none;cursor:pointer;font-weight:600;font-size:14.5px;color:var(--fg);text-align:left}
.nav button svg{color:var(--muted);flex:none}
.nav button:hover{background:var(--panel)}
.nav button[aria-current="page"]{background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:color-mix(in srgb,var(--accent) 35%,transparent);box-shadow:inset 3px 0 0 var(--accent)}
.nav button[aria-current="page"] svg{color:var(--accent)}
.side-foot{margin-top:auto;padding:16px 20px;color:var(--faint);font-size:11.5px;border-top:1px solid var(--line)}

/* Header */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;padding:14px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h1{font-size:18px;font-weight:800;margin:0;padding-right:18px;border-right:1px solid var(--line-2)}
.top .period{color:var(--muted);font-size:13.5px}
.filters{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sel{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line-2);border-radius:10px;padding:0 4px 0 11px;height:38px}
.sel span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.sel select{background:transparent;border:0;height:36px;padding:0 6px;font-weight:600;max-width:190px;cursor:pointer}
.sel select option{background:var(--panel);color:var(--fg)}
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);font-weight:700;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#04191c;border-color:var(--accent)}
.btn.ghost{background:transparent}

.content{padding:24px 28px 48px;display:flex;flex-direction:column;gap:22px}
.grid-ov{display:grid;grid-template-columns:minmax(300px,370px) minmax(0,1fr);gap:22px;align-items:start}
.col{display:flex;flex-direction:column;gap:22px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px 26px;min-width:0}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 18px}
.eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.eyebrow .hint{margin-left:auto;letter-spacing:0;text-transform:none;font-weight:500;font-size:12px;color:var(--faint)}

/* KPI list */
.kpis{display:flex;flex-direction:column;gap:22px}
.kpi{display:grid;grid-template-columns:3px 1fr;gap:14px;align-items:stretch}
.kpi i{border-radius:3px;background:var(--pos)}
.kpi.k-neg i{background:var(--neg)}
.kpi.k-neu i{background:var(--accent)}
.kpi b{display:block;font-size:clamp(21px,2.2vw,27px);font-weight:800;letter-spacing:-.01em;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:13.5px;font-weight:500}
.result{background:radial-gradient(120% 100% at 0% 0%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 62%),var(--panel);border-color:color-mix(in srgb,var(--accent) 28%,var(--line))}
.result .big{font-size:clamp(24px,2.4vw,30px);font-weight:800;font-variant-numeric:tabular-nums}
.result .sub{color:var(--muted);font-size:13.5px}
.result hr{border:0;border-top:1px solid var(--line-2);margin:20px 0}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;margin-top:12px}
.status.ok{background:color-mix(in srgb,var(--pos) 16%,transparent);color:var(--pos)}
.status.bad{background:color-mix(in srgb,var(--neg) 16%,transparent);color:var(--neg)}
.status.mid{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}

/* chips & tabs */
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line-2);border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:600}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip code{font-family:var(--f-mono);font-size:12.5px;font-weight:700}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tab{height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel-2);font-weight:700;cursor:pointer}
.tab:hover{border-color:var(--accent)}
.tab[aria-selected="true"]{border-color:var(--accent);color:var(--accent-ink);background:color-mix(in srgb,var(--accent) 12%,transparent);box-shadow:0 0 0 1px var(--accent) inset}

.chart{width:100%;position:relative}
.chart svg{display:block;max-width:none;overflow:visible}
.chart.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
.chart.scroll::after{content:"Arraste para o lado para ver todos os meses";display:block;position:sticky;left:0;color:var(--faint);font-size:11.5px;margin-top:4px}
.chart text{font-family:var(--f-sans)}
.axis{fill:var(--faint);font-size:11px}
.axis-m{fill:var(--muted);font-size:12px;font-weight:700;letter-spacing:.06em}
.grid-l{stroke:var(--line);stroke-width:1}
.lbl-pos{fill:var(--pos);font-size:10.5px;font-weight:800}
.lbl-neg{fill:var(--neg);font-size:10.5px;font-weight:800}
.lbl-pt{fill:var(--fg);font-family:var(--f-mono)!important;font-size:12px;font-weight:700}
.empty{color:var(--muted);padding:40px 0;text-align:center}

#tip{position:fixed;z-index:50;pointer-events:none;background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:9px 12px;font-size:12.5px;white-space:pre;box-shadow:0 12px 30px rgba(0,0,0,.3);font-variant-numeric:tabular-nums}

/* tiles row */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.tile span{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
.tile b{display:block;font-size:22px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.tile small{color:var(--faint);font-size:12px}

/* tables */
.tw{overflow-x:auto;margin:0 -6px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:800;text-align:left;padding:10px 8px;border-bottom:1px solid var(--line-2);white-space:nowrap;cursor:default}
td{padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel-2)}
.pos{color:var(--pos)} .neg{color:var(--neg)} .mut{color:var(--muted)}
.mix{display:flex;height:10px;border-radius:5px;overflow:hidden;min-width:120px;background:var(--panel-2)}
.mix i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12.5px;color:var(--muted);margin:4px 0 14px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.cin{width:120px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;padding:6px 8px;text-align:right;font-variant-numeric:tabular-nums}
.prog{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.prog .bar{width:70px;height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--accent)}
.hbars{display:flex;flex-direction:column;gap:12px}
.hbar{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr) auto;gap:12px;align-items:center;font-size:13px}
.hbar .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .b{height:12px;border-radius:4px;background:var(--panel-2);overflow:hidden}
.hbar .b i{display:block;height:100%;border-radius:4px}
.hbar .v{font-variant-numeric:tabular-nums;font-weight:700;min-width:110px;text-align:right}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.searchrow{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.inp{height:38px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:0 12px;min-width:0}
.searchrow .inp{flex:1 1 240px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--panel-2);color:var(--muted);white-space:nowrap}
.note{color:var(--faint);font-size:12.5px;margin-top:12px}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--bg-2);border-left:1px solid var(--line-2);z-index:41;display:flex;flex-direction:column}
.drawer header{display:flex;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--line);padding-top:calc(18px + env(safe-area-inset-top,0px))}
.drawer header h2{margin:0;font-size:17px;font-weight:800}
.drawer header .btn{margin-left:auto}
.dbody{overflow:auto;padding:8px 22px 30px;display:flex;flex-direction:column}
.dsec{padding:18px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.dsec h3{margin:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800}
.dsec p{margin:0;color:var(--faint);font-size:12.5px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field .inp{width:100%}
.field label{font-size:12.5px;font-weight:700;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:30px;height:30px;border-radius:8px;border:2px solid transparent;cursor:pointer}
.sw[aria-pressed="true"]{border-color:var(--fg)}
.seg{display:flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.seg button{flex:1;height:36px;border:0;background:var(--panel);cursor:pointer;font-weight:700;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#04191c}
.maprow{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:10px;align-items:center;font-size:13px}
.maprow select{height:34px;background:var(--panel);border:1px solid var(--line-2);border-radius:8px;padding:0 8px;min-width:0}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.checks label{display:flex;gap:8px;align-items:center;font-size:13.5px;font-weight:600}
textarea.inp{height:150px;padding:10px 12px;font-family:var(--f-mono);font-size:12.5px;resize:vertical}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:#04191c;font-weight:800;padding:10px 18px;border-radius:10px;z-index:60}

.mob-only{display:none}
.hint-pay{margin-top:6px;font-size:12px;color:var(--warn)}
.link{background:none;border:0;padding:0;color:var(--accent-ink);font-weight:800;cursor:pointer;text-decoration:underline;font-size:12px}
.chk{width:20px;height:20px;accent-color:var(--accent);cursor:pointer}
table.dfc{min-width:900px}
table.dfc td:first-child,table.dfc th:first-child{position:sticky;left:0;background:var(--panel);z-index:1;white-space:nowrap}
table.dfc tr.tot td{font-weight:800;border-top:1px solid var(--line-2);background:color-mix(in srgb,var(--accent) 5%,var(--panel))}
table.dfc tr.tot td:first-child{background:color-mix(in srgb,var(--accent) 5%,var(--panel))}
table.dfc td.r{font-size:12.5px}
@media (max-width:1180px){.grid-ov{grid-template-columns:1fr}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .brand{border:0;min-height:0;padding:12px 16px}
  .navlabel,.side-foot{display:none}
  .nav{flex-direction:row;padding:0 12px 0 0}
  .nav button{white-space:nowrap;padding:9px 12px}
  .top{padding:12px 16px;position:static}
  .filters{margin-left:0;width:100%}
  .content{padding:16px 16px 40px}
  .panel{padding:18px 16px}
  .two{grid-template-columns:1fr}
  .hbar{grid-template-columns:minmax(0,110px) minmax(0,1fr) auto}
  .hbar .v{min-width:0}
}
@media (max-width:700px){
  .brand small{display:none}
  .top h1{border:0;padding:0;width:100%}
  .filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .filters .sel:last-child{grid-column:1/-1}
  .sel{min-width:0}.sel select{flex:1;min-width:0;max-width:none}
  .tiles{grid-template-columns:1fr 1fr;gap:10px}
  .tile{padding:14px}.tile b{font-size:17px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;margin-inline:-16px;padding-inline:16px;-webkit-overflow-scrolling:touch}
  .tab{flex:none}
  .eyebrow{flex-wrap:wrap}.eyebrow .hint{margin-left:0;width:100%}
  table.cards,table.cards tbody,table.cards tr,table.cards td{display:block;width:100%}
  table.cards thead{display:none}
  table.cards tr{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:var(--panel-2)}
  table.cards td{border:0;padding:5px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:right}
  table.cards td::before{content:attr(data-l);color:var(--muted);font-size:12px;font-weight:600;text-align:left}
  table.cards td.cardhead{display:block;text-align:left;padding-bottom:8px;margin-bottom:4px;border-bottom:1px solid var(--line)}
  table.cards td.cardhead::before{content:none}
  table.cards .mix{flex:1;max-width:60%}
  table.lanc td{display:block;text-align:left;padding:2px 0}
  table.lanc td::before{content:none}
  table.lanc td.r{font-size:15px;font-weight:800;padding-top:6px}
  .tw{margin:0}
  .mob-only{display:block}.desk-only{display:none}
  .aphead{display:flex!important;justify-content:space-between;align-items:center;gap:10px}
  table.ap td[data-l="Pago"],table.ap td[data-l="Vencimento"],table.ap td[data-l="Categoria"],table.ap td[data-l="Obra"]{display:none}
}
@media (prefers-reduced-motion:no-preference){.chart rect.bar,.chart path.area{transition:opacity .2s}}
</style>

</head><body style="margin:0">
<div class="app">
  <aside class="side">
    <div class="brand" id="brand"></div>
    <div class="navlabel">Painel</div>
    <nav class="nav" id="nav">
      <button data-view="geral"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Visão Geral</button>
      <button data-view="receitas"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>Receitas</button>
      <button data-view="despesas"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>Despesas</button>
      <button data-view="fluxo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Fluxo de Caixa</button>
      <button data-view="tesouraria"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h18M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 21h18M12 3l9 5H3z"/></svg>Tesouraria</button>
    </nav>
    <div class="navlabel">Detalhes</div>
    <nav class="nav">
      <button data-view="obras"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6"/></svg>Obras</button>
      <button data-view="lanc"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Lançamentos</button>
    </nav>

function sums(list){const s={};GROUPS.forEach(([k])=>s[k]=0);list.forEach(r=>s[r.g]+=r.v);return s}
function metrics(s){const r=s.receita,imp=s.imposto,c=s.custo,d=s.despesa,f=s.financeira;
  const despesa=imp+c+d+f+s.investimento+s.socios;const bruto=r-imp-c,ebitda=bruto-d,resultado=ebitda-f,liquido=r-despesa;
  return {receita:r,despesa,impostos:imp,custo:c,bruto,ebitda,resultado,liquido,margem:r?liquido/r*100:null}}
function months(){
  if(F.ano!=='todos')return Array.from({length:12},(_,i)=>F.ano+'-'+String(i+1).padStart(2,'0'));
  const ds=DATA.map(r=>dateOf(r).slice(0,7)).sort();if(!ds.length)return[];let [y,m]=ds[0].split('-').map(Number);const end=ds[ds.length-1];const out=[];
  while(true){const k=y+'-'+String(m).padStart(2,'0');out.push(k);if(k>=end)break;m++;if(m>12){m=1;y++}}return out;
}
const mLabel=(k,multi)=>MESES[+k.slice(5)-1]+(multi?'/'+k.slice(2,4):'');
function byMonth(list){const ms=months(),idx={};ms.forEach((k,i)=>idx[k]=i);const arr=ms.map(()=>[]);list.forEach(r=>{const i=idx[dateOf(r).slice(0,7)];if(i!=null)arr[i].push(r)});return {ms,mets:arr.map(l=>l.length?metrics(sums(l)):null)}}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;const s=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10;return s*p}

function chartW(el,n){const w=el.clientWidth;el.classList.toggle('scroll',w<n*52);return Math.max(w,n*52)}
function drawBars(el,{ms,mets}){
  const W=chartW(el,(ms.length+1)*1.25),H=360,pl=62,pr=8,pt=58,pb=50,multi=F.ano==='todos';
  const raw=Math.max(1,...mets.map(x=>x?Math.max(x.receita,x.despesa):0));const step=niceMax(raw/5);const nT=Math.ceil(raw/step);const max=step*nT;const ih=H-pt-pb,iw=W-pl-pr,band=iw/ms.length;
  const y=v=>pt+ih-(v/max)*ih;const bw=Math.min(36,band*0.34),gap=Math.min(6,band*.05);
  let g='';for(let i=0;i<=nT;i++){const v=step*i;g+=`<line class="grid-l" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${pl-8}" y="${y(v)+4}" text-anchor="end">R$${Math.round(v/1000).toLocaleString('pt-BR')} K</text>`}
  const showL=band>=50;
  ms.forEach((k,i)=>{const cx=pl+band*i+band/2,x=mets[i];
    g+=`<text class="axis-m" x="${cx}" y="${H-pb+24}" text-anchor="middle">${mLabel(k,multi)}</text>`;
    const r=x?x.receita:0,d=x?x.despesa:0;
    g+=`<rect class="bar" x="${cx-bw-gap/2}" y="${y(r)}" width="${bw}" height="${Math.max(1.5,y(0)-y(r))}" rx="3" fill="${r?'var(--pos)':'var(--line-2)'}"/>`;
    g+=`<rect class="bar" x="${cx+gap/2}" y="${y(d)}" width="${bw}" height="${Math.max(1.5,y(0)-y(d))}" rx="3" fill="${d?'var(--neg)':'var(--line-2)'}"/>`;
    if(x&&showL){const top=y(Math.max(r,d))-24;g+=`<text class="lbl-pos" x="${cx}" y="${top}" text-anchor="middle">${brlK(r)}</text><text class="lbl-neg" x="${cx}" y="${top+15}" text-anchor="middle">${brlK(d)}</text>`}
    if(x)g+=`<rect x="${pl+band*i}" y="${pt-40}" width="${band}" height="${ih+40}" fill="transparent" data-tip="${esc(mLabel(k,true))}\nReceita  ${brl(r)}\nDespesa  ${brl(d)}\nLíquido  ${brl(r-d)}"/>`;
  });
  g+=`<text class="axis-m" x="${pl+iw/2}" y="${H-6}" text-anchor="middle" style="letter-spacing:.3em">${F.ano==='todos'?'PERÍODO COMPLETO':F.ano}</text>`;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Receitas e despesas por mês">${g}</svg>`;
}
function drawLine(el,{ms,mets},key){
  const W=chartW(el,ms.length),H=320,pl=16,pr=16,pt=40,pb=40,multi=F.ano==='todos';
  const vals=mets.map(x=>x?x[key]:null);const pts=vals.map((v,i)=>v==null?null:[i,v]).filter(Boolean);
  if(!pts.length){el.innerHTML='<div class="empty">Sem lançamentos no período.</div>';return}
  let mx=Math.max(0,...pts.map(p=>p[1])),mn=Math.min(0,...pts.map(p=>p[1]));if(mx===mn)mx=mn+1;const pad=(mx-mn)*.08;mx+=pad;if(mn<0)mn-=pad;
  const iw=W-pl-pr,ih=H-pt-pb,band=iw/ms.length;const X=i=>pl+band*i+band/2,Y=v=>pt+ih-(v-mn)/(mx-mn)*ih;
  const P=pts.map(([i,v])=>[X(i),Y(v),v,i]);
  let d=`M${P[0][0]},${P[0][1]}`;for(let j=1;j<P.length;j++){const p0=P[j-2]||P[j-1],p1=P[j-1],p2=P[j],p3=P[j+1]||p2;const t=.18;
    d+=` C${p1[0]+(p2[0]-p0[0])*t},${p1[1]+(p2[1]-p0[1])*t} ${p2[0]-(p3[0]-p1[0])*t},${p2[1]-(p3[1]-p1[1])*t} ${p2[0]},${p2[1]}`}
  const area=d+` L${P[P.length-1][0]},${Y(Math.max(mn,0))} L${P[0][0]},${Y(Math.max(mn,0))} Z`;
  const f=v=>IND[key].pct?pct(v):brl(v);
  const iMax=P.reduce((a,b)=>b[2]>a[2]?b:a),iMin=P.reduce((a,b)=>b[2]<a[2]?b:a);const all=band>=96;
  let g=`<defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".38"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>`;
  if(mn<0)g+=`<line class="grid-l" x1="${pl}" x2="${W-pr}" y1="${Y(0)}" y2="${Y(0)}" stroke-dasharray="4 4"/>`;
  ms.forEach((k,i)=>g+=`<text class="axis-m" x="${X(i)}" y="${H-12}" text-anchor="middle">${mLabel(k,multi)}</text>`);
  g+=`<path class="area" d="${area}" fill="url(#ga)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.6"/>`;
  P.forEach(p=>{const lab=all||p===iMax||p===iMin||p===P[P.length-1];
    g+=`<circle cx="${p[0]}" cy="${p[1]}" r="${lab?5:3.5}" fill="var(--accent)" stroke="var(--panel)" stroke-width="2"/>`;
    if(lab){const below=p[2]<0;g+=`<text class="lbl-pt" x="${p[0]}" y="${below?p[1]+22:p[1]-12}" text-anchor="middle" style="${p[2]<0?'fill:var(--neg)':''}">${IND[key].pct?pct(p[2]):brlK(p[2])}</text>`}
    g+=`<rect x="${p[0]-band/2}" y="${pt-30}" width="${band}" height="${ih+30}" fill="transparent" data-tip="${esc(mLabel(ms[p[3]],true))}\n${esc(IND[key].label)}  ${f(p[2])}"/>`});
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(IND[key].label)} por mês">${g}</svg>`;
}

function drawCombo(el,ms,bars,line,o={}){

/* ---------- Fluxo de caixa ---------- */
const DFC=[['receita','Recebimentos de clientes'],['imposto','Impostos'],['custo','Custos de obra'],['despesa','Despesas operacionais'],['financeira','Despesas financeiras'],['=op','Caixa das operações'],['investimento','Investimentos (bens)'],['socios','Sócios e empréstimos'],['ignorar','Transferências e ajustes de saldo'],['=var','Variação do caixa'],['=ini','Saldo inicial'],['=fim','Saldo final']];
function viewFluxo(){
  const base=cashList();const ms=periodMonths();const first=ms[0]+'-01';
  const ini=base.filter(r=>r.e<first).reduce((a,r)=>a+cashSign(r)*r.v,0);
  const cols=ms.map(k=>{const l=base.filter(r=>r.e.startsWith(k));const g={};GROUPS.forEach(([x])=>g[x]=0);let ent=0,sai=0;l.forEach(r=>{const v=cashSign(r)*r.v;g[r.g]+=v;if(v>0)ent+=v;else sai-=v});return {g,ent,sai,var:ent-sai,n:l.length}});
  let acc=ini;cols.forEach(c=>{c.ini=acc;acc+=c.var;c.fim=acc});
  const lastData=cols.reduce((a,c,i)=>c.n?i:a,-1);
  const E=cols.reduce((a,c)=>a+c.ent,0),S=cols.reduce((a,c)=>a+c.sai,0);
  const val=(c,k)=>k==='=op'?['receita','imposto','custo','despesa','financeira'].reduce((a,x)=>a+c.g[x],0):k==='=var'?c.var:k==='=ini'?c.ini:k==='=fim'?c.fim:c.g[k];
  const tot=k=>k==='=ini'?ini:k==='=fim'?acc:cols.reduce((a,c)=>a+val(c,k),0);
  const cell=v=>`<td class="r ${v<-0.004?'neg':''}">${Math.abs(v)<0.005?'<span class="mut">—</span>':brl(v)}</td>`;
  const table=`<div class="tw"><table class="dfc"><thead><tr><th>Fluxo de caixa</th>${ms.map(k=>`<th class="r">${mLabel(k,multiYear())}</th>`).join('')}<th class="r">Total</th></tr></thead><tbody>
    ${DFC.map(([k,l])=>`<tr class="${k[0]==='='?'tot':''}"><td>${l}</td>${cols.map((c,i)=>i>lastData&&k!=='=ini'&&k!=='=fim'?'<td class="r"><span class="mut">—</span></td>':i>lastData?'<td class="r"><span class="mut">—</span></td>':cell(val(c,k))).join('')}${cell(tot(k))}</tr>`).join('')}</tbody></table></div>`;
  // projeção
  const t=todayStr(),cy=t.slice(0,7),cyY=+t.slice(0,4);const proj=[];for(let i=0;i<3;i++){let y=cyY,m=+t.slice(5,7)+i;while(m>12){m-=12;y++}proj.push(y+'-'+String(m).padStart(2,'0'))}
  const open=apList().filter(p=>apStatus(p,t)!=='pago');const saldo=saldoAtual();let run=saldo;
  const pj=proj.map((k,i)=>{const pag=open.filter(p=>i===0?(!p.venc||p.venc.slice(0,7)<=k):p.venc.slice(0,7)===k).reduce((a,p)=>a+p.v,0);const rec=+(cfg.prevRec[k]||0);const ini=run;run=run+rec-pag;return {k,pag,rec,ini,fim:run}});
  $('#content').innerHTML=`<div class="tiles">
    <div class="tile"><span>Entradas no período</span><b class="pos">${brl(E)}</b></div>
    <div class="tile"><span>Saídas no período</span><b class="neg">${brl(S)}</b></div>
    <div class="tile"><span>Geração de caixa</span><b class="${E-S<0?'neg':'pos'}">${brl(E-S)}</b><small>entradas − saídas</small></div>
    <div class="tile"><span>Saldo final calculado</span><b class="${acc<0?'neg':''}">${brl(acc)}</b><small>saldo inicial ${brl(ini)}</small></div></div>
   <section class="panel"><h2 class="eyebrow">Entradas, saídas e saldo<span class="hint">Pela data em que o dinheiro entrou ou saiu da conta</span></h2>
    ${legend([['Entradas','var(--pos)'],['Saídas','var(--neg)'],['Saldo acumulado','var(--accent)']])}<div class="chart" id="cFlx"></div></section>
   <section class="panel"><h2 class="eyebrow">Demonstrativo mês a mês</h2>${table}</section>
   <section class="panel"><h2 class="eyebrow">Projeção dos próximos meses<span class="hint">Saldo atual − contas a pagar + recebimentos previstos que você digitar</span></h2>
    <div class="tw"><table class="cards"><thead><tr><th>Mês</th><th class="r">Saldo inicial</th><th class="r">Recebimentos previstos</th><th class="r">Contas a pagar</th><th class="r">Saldo projetado</th></tr></thead><tbody>
    ${pj.map((x,i)=>`<tr><td class="cardhead"><b>${MES_LONGO[+x.k.slice(5)-1]} ${x.k.slice(0,4)}</b>${i===0?'<div class="mut" style="font-size:12px">inclui as contas atrasadas</div>':''}</td><td class="r" data-l="Saldo inicial">${brl(x.ini)}</td>
     <td class="r" data-l="Recebimentos previstos"><input class="cin" data-prev="${x.k}" inputmode="decimal" placeholder="R$ medições" value="${x.rec?nf2.format(x.rec):''}" aria-label="Recebimentos previstos em ${MES_LONGO[+x.k.slice(5)-1]}"></td>
     <td class="r neg" data-l="Contas a pagar">${brl(x.pag)}</td><td class="r ${x.fim<0?'neg':'pos'}" data-l="Saldo projetado"><b>${brl(x.fim)}</b></td></tr>`).join('')}</tbody></table></div>
    <p class="note">As contas a pagar vêm da Tesouraria. Use os recebimentos previstos para lançar medições e parcelas que os clientes ainda vão pagar.</p></section>`;
  drawCombo($('#cFlx'),ms,[{name:'Entradas',vals:cols.map(c=>c.ent),color:'var(--pos)'},{name:'Saídas',vals:cols.map(c=>-c.sai),color:'var(--neg)'}],{name:'Saldo acumulado',vals:cols.map((c,i)=>i<=lastData?c.fim:null),color:'var(--accent)'},{aria:'Fluxo de caixa mensal'});
  document.querySelectorAll('[data-prev]').forEach(inp=>inp.onchange=()=>{const v=parseFloat(inp.value.replace(/[^\d,.-]/g,'').replace(/\./g,'').replace(',','.'));if(v>0)cfg.prevRec[inp.dataset.prev]=v;else delete cfg.prevRec[inp.dataset.prev];save();render()});
}

/* importar contas a pagar */
function importAP(file){
  if(!file)return;if(typeof XLSX==='undefined'){toast('Leitor de planilhas não carregou. Recarregue a página.');return}
  const rd=new FileReader();rd.onload=()=>{try{const wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});
    const names=wb.SheetNames;const def=names.filter(n=>/^\d{2}-\d{4}$/.test(n)).sort((a,b)=>(a.slice(3)+a.slice(0,2)).localeCompare(b.slice(3)+b.slice(0,2))).pop()||names[0];
    $('#apPick').innerHTML=`<div class="row2" style="align-items:end"><div class="field"><label for="apSheet">Aba com as contas</label><select class="inp" id="apSheet">${names.map(n=>`<option ${n===def?'selected':''}>${esc(n)}</option>`).join('')}</select></div><button class="btn primary" id="apGo">Carregar contas</button></div>`;
    $('#apGo').onclick=()=>{try{const name=$('#apSheet').value;const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null});
      const hi=rows.findIndex(r=>r&&r.some(c=>norm(c)==='fornecedor')&&r.some(c=>norm(c)==='valor'));if(hi<0)throw new Error('Não encontrei as colunas FORNECEDOR e VALOR nessa aba.');
      const H=rows[hi].map(norm);const ix=(...k)=>H.findIndex(h=>k.some(x=>h.startsWith(x)));
      const c={f:ix('fornecedor'),v:ix('vencimento'),val:ix('valor'),fp:ix('forma'),cat:ix('categoria'),obs:ix('obs'),st:ix('situacao','status')};
      const toD=x=>{if(typeof x==='number'&&x>20000){const p=XLSX.SSF.parse_date_code(x);return p.y+'-'+String(p.m).padStart(2,'0')+'-'+String(p.d).padStart(2,'0')}const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(String(x||''));return m?m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'):''};
      const out=[];rows.slice(hi+1).forEach(r=>{if(!r)return;const f=r[c.f];const v=typeof r[c.val]==='number'?r[c.val]:parseFloat(String(r[c.val]||'').replace(/[^\d,.-]/g,'').replace(/\./g,'').replace(',','.'));
        if(!f||!isFinite(v)||!v)return;const s=c.st>=0?r[c.st]:'';out.push([String(f).trim(),toD(r[c.v]),Math.round(v*100)/100,String(c.fp>=0&&r[c.fp]||'').trim(),String(c.cat>=0&&r[c.cat]||'').trim(),String(c.obs>=0&&r[c.obs]||'').trim(),typeof s==='number'?toD(s):String(s||'').trim()])});
      if(!out.length)throw new Error('Nenhuma conta encontrada nessa aba.');
      RAWAP={sheet:name,rows:out};const ok=LS.set('obrasdash.ap',RAWAP);apHydrate();render();openCfg();toast(`${out.length} contas carregadas da aba ${name}`+(ok?'':' (não foi possível salvar no navegador)'))}catch(err){toast(err.message||'Não consegui ler a aba.')}};
  }catch(err){toast(err.message||'Não consegui ler a planilha.')}};rd.readAsArrayBuffer(file);
}

  if($('#cAPo'))$('#cAPo').onclick=()=>{LS.del('obrasdash.ap');RAWAP=EMBED_AP;apHydrate();render();openCfg();toast('Contas originais restauradas')};
  if($('#cOrig'))$('#cOrig').onclick=()=>{LS.del('obrasdash.data');RAW=EMBED;hydrate();fillFilters();render();openCfg();toast('Dados originais restaurados')};
  $('#cReset').onclick=()=>{const keep={contratos:cfg.contratos,pagos:cfg.pagos,saldos:cfg.saldos,prevRec:cfg.prevRec};cfg=Object.assign(JSON.parse(JSON.stringify(DEFAULT_CFG)),keep);save();applyTheme();hydrate();apHydrate();fillFilters();render();openCfg();toast('Personalização restaurada')};
}
function closeCfg(){$('#drawer').hidden=true;$('#scrim').hidden=true}
function save(){return LS.set('obrasdash.cfg',cfg)}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}

function importFile(file){
  if(!file)return;if(typeof XLSX==='undefined'){toast('Leitor de planilhas não carregou. Recarregue a página.');return}
  const rd=new FileReader();rd.onload=()=>{try{
    const wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{defval:null,raw:true});
    if(!rows.length)throw new Error('A planilha está vazia.');const keys=Object.keys(rows[0]);const find=(...t)=>keys.find(k=>t.every(x=>norm(k).includes(x)));
    const K={c:find('competencia'),e:find('efetiva'),b:find('institui'),k:keys.find(k=>norm(k)==='categoria'),s:find('subcategoria'),d:find('descri'),v:find('valor'),st:find('status')};
    if(!K.c||!K.k||!K.v)throw new Error('Não encontrei as colunas Data de Competência, Categoria e Valor.');
    const toD=x=>{if(x==null||x==='')return null;if(typeof x==='number'){const p=XLSX.SSF.parse_date_code(x);return p.y+'-'+String(p.m).padStart(2,'0')+'-'+String(p.d).padStart(2,'0')}
      const s=String(x).trim();let m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s);if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s);return m?m[0]:null};
    const toN=x=>typeof x==='number'?x:parseFloat(String(x||'').replace(/[^\d,.-]/g,'').replace(/\./g,'').replace(',','.'))||0;
    const out={banks:[],cats:[],subs:[],descs:[],rows:[]};const ix={};const id=(a,v)=>{v=v==null?'':String(v);const m=ix[a]||(ix[a]={});if(!(v in m)){m[v]=out[a].length;out[a].push(v)}return m[v]};
    rows.forEach(r=>{const c=toD(r[K.c]);if(!c)return;const e=toD(K.e&&r[K.e])||c;
      out.rows.push([c,e,id('banks',K.b&&r[K.b]),id('cats',r[K.k]),id('subs',K.s&&r[K.s]),id('descs',K.d&&r[K.d]),Math.round(Math.abs(toN(r[K.v]))*100)/100,K.st&&norm(r[K.st]).startsWith('pend')?1:0])});
    if(!out.rows.length)throw new Error('Nenhuma linha com data válida.');
    RAW=out;const ok=LS.set('obrasdash.data',out);hydrate();F.ano='';fillFilters();render();openCfg();toast(`${out.rows.length.toLocaleString('pt-BR')} lançamentos carregados`+(ok?'':' (não foi possível salvar no navegador)'));
  }catch(err){toast(err.message||'Não consegui ler a planilha.')}};rd.readAsArrayBuffer(file);
}

/* ---------- boot ---------- */
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{VIEW=b.dataset.view;render();window.scrollTo(0,0)});
$('#fAno').onchange=e=>{F.ano=e.target.value;render()};$('#fConta').onchange=e=>{F.conta=e.target.value;render()};$('#fObra').onchange=e=>{F.obra=e.target.value;render()};
$('#openCfg').onclick=openCfg;$('#closeCfg').onclick=closeCfg;$('#scrim').onclick=closeCfg;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCfg()});
const tip=$('#tip');document.addEventListener('mousemove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tip.hidden=true;return}tip.textContent=t.getAttribute('data-tip');tip.hidden=false;
  const w=tip.offsetWidth,h=tip.offsetHeight;tip.style.left=Math.min(innerWidth-w-8,e.clientX+14)+'px';tip.style.top=Math.max(8,e.clientY-h-10)+'px'});
let rzT,lastW=0;new ResizeObserver(()=>{const w=$('#content').clientWidth;if(Math.abs(w-lastW)<4)return;lastW=w;clearTimeout(rzT);rzT=setTimeout(()=>{if(['geral','receitas','despesas','fluxo'].includes(VIEW))render()},120)}).observe($('#content'));
applyTheme();hydrate();apHydrate();fillFilters();render();
</script>
